version: 2

project_name: quark

builds:
  - id: quark
    # The CLI is its own Go module (ADR-0024), so the build happens INSIDE it.
    # `dir` makes GoReleaser run the Go command there; `main` is then relative
    # to that directory. The module requires the library by version rather
    # than by a replace directive — a published module carrying a replace is
    # one `go install` refuses — so the release job writes a go.work before
    # this runs, which is what points the requirement at the tree being
    # tagged instead of at the previous release.
    dir: ./cmd/quark
    main: .
    binary: quark
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Two versions, because since ADR-0024 there are two.
    #
    # `version` is the CLI's own, from the `cmd/quark/vX.Y.Z` series. It is
    # what `go install .../cmd/quark@latest` records in the binary's build
    # info, so stamping anything else here would make the same program report
    # one string when downloaded and another when installed — which is the
    # trap this stamp was added to avoid in the first place. The release job
    # reads it off the CLI tag at HEAD and exports QUARK_CLI_VERSION; a local
    # snapshot build has to export it too.
    #
    # `libraryVersion` is the ORM release the archive belongs to — the root
    # tag, which is also what names the archive. Without it the release build
    # would report "devel" for the library, because it resolves the library
    # through the workspace rather than from the proxy.
    ldflags:
      - -s -w -X github.com/jcsvwinston/quark/cmd/quark/commands.version={{ .Env.QUARK_CLI_VERSION }} -X github.com/jcsvwinston/quark/cmd/quark/commands.libraryVersion=v{{ .Version }}

# The archives are assets of the LIBRARY release and are named after its tag:
# the release workflow runs at `vX.Y.Z`, and that is the version a reader has
# in hand when they follow the verification page. The binary inside reports
# its own, shorter version series — see the ldflags above, and
# website/docs/operations/verifying-releases.mdx, which explains the pair.
archives:
  - id: cli-binaries
    ids:
      - quark
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive. The SBOM pipe runs BEFORE the checksum pipe, so
# the six .spdx.json documents are listed in checksums.txt alongside the six
# archives — which is why signing that one file covers every artifact we
# publish. Neither goreleaser nor goreleaser-action ships syft: the release
# workflow downloads it before this runs, and without it the release fails
# loudly here rather than publishing archives with no SBOM beside them.
#
# The document is worth reading for this binary in particular. The CLI speaks
# to every engine Quark supports, so it links all five of them — pgx,
# go-sql-driver/mysql, go-mssqldb, go-ora and modernc.org/sqlite — and the
# SBOM is where that shows up as fact rather than as a claim on a docs page.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args:
      - scan
      - "$artifact"
      - --output
      - spdx-json=$document

# Keyless signature over the checksum file. The signing identity is the OIDC
# token GitHub mints for the release job, so there is no key to hold and no
# secret to rotate; what a consumer checks is which workflow, in which
# repository, at which ref produced the signature. Release Please dispatches
# that workflow at the TAG ref, so the identity ends in
# `.../release.yml@refs/tags/vX.Y.Z` — see the verification page under
# website/docs/operations for the command that consumes this.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

release:
  # The idempotency guard in the release workflow re-runs GoReleaser when a
  # release carries archives but not the signature, the certificate or the
  # SBOMs. That re-run has to be able to overwrite the assets the failed run
  # already uploaded, or the repair it exists for cannot happen.
  replace_existing_artifacts: true

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: true
