# Dependency update proposals, weekly, grouped so a Monday brings one pull
# request per family of modules rather than one per module and one per
# dependency. Quark is eleven Go modules — the library at the root, the CLI,
# the five driver modules and four local harnesses — so each family is listed
# on its own, with the reason for every `ignore` written next to it. Every go.mod in the tree has an entry here, and
# the lint job fails if one appears without it.
version: 2
updates:
  # The library module. This is the go.mod that ships to consumers and the one
  # govulncheck scans, so its updates are the ones worth reading first.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  # The CLI. It is published and installed with `go install`, so its
  # dependencies are the ones a user ends up running (ADR-0024) — it links
  # every engine, which is exactly the weight that came out of the library
  # module. Kept apart from the root for the same reason as the drivers: a
  # bump here ends up in a `cmd/quark` release, on its own version series.
  - package-ecosystem: gomod
    # Written as a one-entry list rather than `directory:` on purpose: the
    # lint job in ci.yml looks for `- /<dir>` for every go.mod outside the
    # root, so the singular form would read as "not covered".
    directories:
      - /cmd/quark
    schedule:
      interval: weekly
    groups:
      cli-module:
        patterns: ["*"]
    ignore:
      # The library and driver requirements are floors raised on purpose as
      # the first commit of a release train, the same way the driver modules
      # raise theirs — and unlike them, this module cannot carry a `replace`
      # to close the gap: `go install` refuses a module whose go.mod has one.
      - dependency-name: github.com/jcsvwinston/quark
      - dependency-name: github.com/jcsvwinston/quark/drivers/*

  # The five driver modules. They are released with their own tags and each
  # one requires the library, so they are updated together but kept apart from
  # the root: a bump here ends up in a driver release.
  - package-ecosystem: gomod
    directories:
      - /drivers/mssql
      - /drivers/mysql
      - /drivers/oracle
      - /drivers/postgres
      - /drivers/sqlite
    schedule:
      interval: weekly
    groups:
      driver-modules:
        patterns: ["*"]
    ignore:
      # The Quark requirement in a driver module is a floor, not a pin to keep
      # current: it is raised on purpose as the first commit of each release
      # train (see "fix(deps): raise the sibling module floors to quark
      # v1.10.1", #348), because the module and the API it consumes ship
      # together. Letting Dependabot close the gap would force every consumer
      # of a driver onto the newest library minor without anyone deciding it.
      - dependency-name: github.com/jcsvwinston/quark

  # The three local harnesses. None is published; they exist so their
  # dependencies (GORM, ent, testcontainers, the per-engine drivers) never
  # reach the library's go.mod. They are still built in CI, so their
  # dependencies still age. internal/enginesuite is the newest of the three
  # and the largest by weight: it holds the per-engine suites, and the eleven
  # modules they need are what ADR-0024 took out of the library's go.mod.
  - package-ecosystem: gomod
    directories:
      - /benchmarks
      - /bugbash
      - /internal/enginesuite
    schedule:
      interval: weekly
    groups:
      harness-modules:
        patterns: ["*"]
    ignore:
      # Both consume the library through `replace github.com/jcsvwinston/quark
      # => ../`, so the version in their require block is never resolved —
      # bugbash writes a zero pseudo-version there on purpose. Any bump of it
      # is noise about a number nothing reads.
      - dependency-name: github.com/jcsvwinston/quark

  # The acceptance harness (ADR-0024). Its dependencies age like any other
  # module's, and a bump that breaks it is caught before it is merged — which
  # is the same reason the harnesses above are covered. It is kept apart from
  # the library because a proposal here changes nothing that ships.
  - package-ecosystem: gomod
    directories:
      - /acceptance
    schedule:
      interval: weekly
    groups:
      example-modules:
        patterns: ["*"]
    ignore:
      # These requirements, and only these, are the ones the `replace`
      # directives at the top of the harness go.mod point back into this
      # tree. Their versions are never resolved, so a proposal against them
      # would move a number the build does not read. Everything else it
      # requires resolves from the proxy and ages normally — the engine
      # libraries underneath (modernc.org/sqlite, jackc/pgx/v5, go-mssqldb,
      # golang.org/x/crypto).
      - dependency-name: github.com/jcsvwinston/quark
      - dependency-name: github.com/jcsvwinston/quark/drivers/*

  # Grouped for the same reason as the modules above: without a group this
  # ecosystem opens one pull request per action, and the workflows here use
  # twelve: actions/checkout, actions/setup-go, actions/upload-pages-artifact,
  # actions/deploy-pages, googleapis/release-please-action,
  # ossf/scorecard-action, actions/upload-artifact,
  # github/codeql-action/upload-sarif, goreleaser/goreleaser-action,
  # sigstore/cosign-installer, anchore/sbom-action/download-syft and
  # actions/attest-build-provenance. They are named rather than counted so
  # that adding a workflow shows what this list owes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # cosign v3 changed `sign-blob` to write a Sigstore bundle, and
      # `--bundle` has no default, so the arguments the release path passes
      # die on an empty path. The v4 installer is what brings cosign v3, and
      # the bump reached nucleus and the umbrella inside a group like this
      # one: nucleus v1.26.0 published with ZERO assets and nothing went red
      # that a guard reads. Moving to cosign v3 changes what the verification
      # page tells people to run, so it is a decision, not a bump. Minors and
      # patches of the v3 line still come through.
      - dependency-name: sigstore/cosign-installer
        update-types: [version-update:semver-major]
