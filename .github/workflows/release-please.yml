name: Release Please

# F0-9. Watches `main` for Conventional Commit messages and keeps a
# rolling "Release PR" open with the next version bump and the
# CHANGELOG entries derived from the commits since the last tag.
# Merging that PR creates the tag and the GitHub Release.
#
# This automates the version-bump + CHANGELOG portion of the release
# process. The Docusaurus docs-versioning step (`docs:version` +
# `versioned_docs/` snapshot) is NOT covered here — that still lives
# in `.claude/commands/release.md` and runs manually before merging
# the release-please PR. See `CLAUDE.md § "Regla de release"` for the
# full DoD.
#
# Config: `release-please-config.json` + `.release-please-manifest.json`
# at the repo root. release-type is Go (single module).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the write that opens the release pull request and creates
# the tag belongs to the one job that does it, not to the whole workflow.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The dispatch in the last step below: without `actions: write` that
      # `gh workflow run` returns 403 and the tag ships with no assets.
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # release-please-action@v4 still declares Node 20 in its
        # action.yml. GitHub forces Node 20 JS actions to Node 24 on
        # 2026-06-02; this env var opts in early so the workflow keeps
        # running through the transition. Remove once the action ships
        # a Node 24 release.
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tags cut by this workflow are created with the GITHUB_TOKEN, and
      # GitHub suppresses events from that token to prevent workflow
      # recursion — so release.yml's `push: tags` trigger NEVER fires for an
      # automatic cut. Chain the asset build explicitly instead, at the ref of
      # the freshly cut LIBRARY tag: that ref is what names the archives, what
      # the release assets land on, and what the certificate identity ends in.
      # release.yml is idempotent — it skips a release that already carries
      # its archives, SBOMs, signature, certificate and attestation, and
      # re-runs GoReleaser when any of those is missing.
      #
      # `tag_name` is the root package's tag. The five `drivers/<engine>`
      # packages of this manifest have their own `<path>--tag_name` outputs
      # and are deliberately not dispatched: they are Go modules consumed from
      # the proxy and publish no binaries.
      - name: Build release assets for the freshly cut root tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -R "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
