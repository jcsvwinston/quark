name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the tree. No job in this workflow
# writes to the repository, comments on a pull request or mints an OIDC token,
# so nothing needs more than `contents: read`. A job that ever does needs its
# own `permissions:` block, not a wider default.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR title in English (QADR-0007)
        # The squash title becomes the changelog line and the release note of
        # an English-speaking product (QM-18). The title goes through an env
        # var, never through the shell line: it is user input.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/ci/check_pr_title_english.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: docs product voice
        # Keeps internal engineering vocabulary out of the published site.
        # A reader evaluating Quark does not know what ADR-0021 is, what "P0"
        # means, or what a "v1 gate" gates — those are artefacts of how we
        # build the thing, not of how anyone uses it. When they leak into
        # website/docs/** the docs read like our ticket queue instead of a
        # product. The internal tree (docs/adr/, SPEC.md, CLAUDE.md) is
        # untouched by this rule; only what we publish has to speak the
        # reader's language.
        run: bash scripts/ci/check_docs_product_voice.sh

      - name: check docs archive freshness
        # El sitio sirve la doc actual y un snapshot por minor publicada. Ese
        # archivo se congeló en 1.2.2 mientras se publicaban 1.3, 1.4 y 1.5:
        # el desplegable ofrecía versiones viejas y saltaba a la actual sin
        # decir que faltaba nada. Una minor sin snapshot ya no pasa.
        run: bash scripts/ci/check_docs_archive_freshness.sh

      - name: check versioned docs markers
        # Un snapshot cortado antes de que release-please suba el marcador
        # congela la versión ANTERIOR y la publica como si fuera la suya: el
        # archivo de 1.6.0 decía «Quark is v1.5.2». Sólo se ve desde fuera, y
        # ningún otro guard lo mira porque la copia es coherente consigo misma.
        run: bash scripts/ci/check_versioned_docs_markers.sh

      - name: check internal docs drift
        # La doc interna (docs/**) no tenía guard: aquí se comprueba que no
        # cite ficheros que ya no existen — enlaces relativos y rutas del
        # repo entre comillas. Los registros históricos (adr/, notas de
        # versión, guías de migración) quedan fuera: son actas fechadas.
        run: bash scripts/ci/check_internal_docs_drift.sh

      - name: lint docs
        # F0-10. Catches doc drift before it lands on main:
        # marketing language ("production-ready" / "enterprise-grade"
        # / "battle-tested"), references to the deleted
        # `RELEASE_NOTES_V1.md`, and broken relative links inside the
        # docs tree. Meta files (CLAUDE.md, TASKS.md, ADRs, blog
        # posts, versioned snapshots) are exempt — they discuss the
        # rules on purpose.
        run: bash scripts/lint-docs.sh

      - name: version coherence
        # H-Q6. The v1.2.0 release shipped while README/SECURITY/CLAUDE.md/
        # release-notes still claimed v1.1.5/v1.1.2/v1.1.0. This fails the
        # release-please PR (and any later drift) until the user-facing
        # version mentions match .release-please-manifest.json and the
        # current minor has a docs/RELEASE_NOTES_vX.Y.0.md. It also holds
        # SECURITY.md's supported-versions table to the manifest: the rows are
        # content release-please does not bump, and had gone five minors stale
        # before. gen_release_notes_skeleton.sh writes them on the release
        # branch, so this equality has an author.
        run: bash scripts/check-version-coherence.sh

      - name: version coherence self-test
        # The supported-versions rule is fed tables that do not exist in the
        # tree, so the run shows it rejecting each way the table can lie. A
        # docs guard fails by passing quietly; this is what makes that visible.
        run: bash scripts/check-version-coherence.sh --self-test

      - name: release skeleton self-test
        # The other half of the same rule: gen_release_notes_skeleton.sh writes
        # the supported-versions rows on the release branch, so the guard above
        # has something that satisfies it. Same tables, seen from the side that
        # fixes them — a writer of docs fails as quietly as a guard of docs.
        run: bash scripts/release/gen_release_notes_skeleton.sh --self-test

      - name: action pins
        # Every `uses:` in .github/workflows is a commit SHA with its tag in a
        # trailing comment. A tag is a pointer somebody else can move under a
        # job that has this repository checked out; the SHA is immutable, and
        # the comment is what Dependabot (github-actions ecosystem, declared in
        # .github/dependabot.yml) rewrites when it proposes the next one.
        run: bash scripts/ci/check_action_pins.sh

      - name: superapp manifest freshness (S7-coverage)
        # The coverage gate's denominator (apisurface.json) and its
        # callable-surface allowlist (allowlist.json) are generated and
        # committed. Regenerate both and fail if they drift: a new public
        # symbol must land with a refreshed manifest in the same PR, so the
        # gate can never silently stop counting it. Order matters —
        # gen-allowlist reads apisurface.json, so regenerate it first.
        # The superapp is its own module since ADR-0024, so both generators
        # run from inside it and write beside themselves. Its go.mod replaces
        # every Quark requirement with this tree, so no workspace is needed:
        # the surface being inventoried is the one in the pull request.
        run: |
          set -euo pipefail
          (cd acceptance && go run ./cmd/gen-apisurface && go run ./cmd/gen-allowlist)
          if ! git diff --quiet acceptance/apisurface.json acceptance/allowlist.json; then
            echo "apisurface.json / allowlist.json are stale. Run:"
            echo "  make regen"
            echo "and commit the result. Drift:"
            git --no-pager diff --stat acceptance/apisurface.json acceptance/allowlist.json
            exit 1
          fi

      - name: every Go module is covered by Dependabot
        # .github/dependabot.yml names its directories one at a time rather
        # than by glob: a hand-kept list is the kind that goes stale in
        # silence — a new module would simply never be offered an
        # update, with nothing on screen to say so. Fail instead, so a module
        # and its entry land in the same pull request. It has caught three
        # already: the CLI, the superapp and the engine suites all became
        # modules in one change (ADR-0024).
        run: |
          set -euo pipefail
          missing=0
          for f in $(find . -name go.mod -not -path './*/node_modules/*' | sort); do
            d=$(dirname "${f#./}")
            if [ "$d" = "." ]; then
              pattern='^[[:space:]]*directory:[[:space:]]*/[[:space:]]*$'
            else
              pattern="^[[:space:]]*-[[:space:]]*/${d}[[:space:]]*$"
            fi
            if ! grep -qE "$pattern" .github/dependabot.yml; then
              echo "$f has no directory entry in .github/dependabot.yml"
              missing=1
            fi
          done
          exit "$missing"

  # DX-1 (auditoría DX 2026-08-16): CGO_ENABLED=0 es el modo por defecto de
  # los Dockerfile scratch/distroless y de todo cross-compile, y estuvo roto
  # (db_errors.go enlazaba mattn/go-sqlite3 sin build tag). Este job impide
  # la regresión compilando el módulo entero sin cgo y en cross-compile.
  static-build:
    name: Static build (CGO_ENABLED=0 + cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The CLI is its own module (ADR-0024) and requires the library by
      # version — it cannot carry a replace, because `go install` refuses a
      # module whose go.mod has one. The workspace is what points that
      # requirement at the tree under review; without it this lane would
      # cross-compile the PREVIOUS release.
      - name: Link the CLI module to this tree
        run: >
          bash scripts/ci/link_workspace.sh .
          cmd/quark
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      - name: CGO_ENABLED=0 go build
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build ./...
          (cd cmd/quark && CGO_ENABLED=0 go build ./...)

      - name: Cross-compile linux/arm64
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=arm64 go build ./...
          (cd cmd/quark && GOOS=linux GOARCH=arm64 go build ./...)

  drivers:
    name: Driver modules
    runs-on: ubuntu-latest

    # The drivers are SEPARATE modules (ADR-0023), so the root
    # `go test ./...` does not reach them. Without this lane they would ship
    # untested — and what they carry decides whether a rejected insert is
    # reported as "already taken", whether a deadlocked transaction is
    # retried, and whether a downed replica is failed over.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Link them to the tree under review: their go.mod pins a PUBLISHED
      # quark, so without the workspace a change to the contract in this very
      # PR would be tested against the previous release instead of against
      # itself.
      - name: Link the driver modules to this tree
        run: >
          bash scripts/ci/link_workspace.sh .
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      - name: Build, vet and test
        run: |
          set -euo pipefail
          for m in drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle; do
            echo "== $m"
            (cd "$m" && go build ./... && go vet ./... && go test ./...)
          done

      # The point of the split, asserted rather than assumed: the library must
      # not reach a driver again. It names pgx separately because the
      # LISTEN/NOTIFY listener is the import that would bring it back, and it
      # would come back through a feature rather than through a classifier.
      - name: The library links no driver
        run: |
          set -euo pipefail
          if go list -deps . 2>/dev/null | grep -E 'go-sql-driver|jackc/pgx|modernc\.org/sqlite|go-mssqldb|sijms/go-ora|mattn/go-sqlite3'; then
            echo "::error::a driver is reachable from the quark library again — that is what ADR-0023 removed" >&2
            exit 1
          fi
          echo "OK: no driver reachable from the library"

      # The number is the point of the arc, so it is worth failing on rather
      # than rediscovering by hand. The ceiling has slack over the measured
      # 159 so ordinary additions do not trip it; a driver coming back does.
      - name: The library stays small
        run: |
          set -euo pipefail
          n=$(go list -deps . | wc -l | tr -d ' ')
          echo "packages reachable from the library: $n"
          if [ "$n" -gt 200 ]; then
            echo "::error::the library graph grew to $n packages (ceiling 200). ADR-0023 measured 159; something large came back." >&2
            exit 1
          fi

  # The published driver modules are consumed WITHOUT this repository's
  # workspace: `go get github.com/jcsvwinston/quark/drivers/sqlite` resolves
  # their go.mod as committed. The `drivers` job above links them to the tree
  # through go.work, which is right for testing the contract but hides a
  # go.mod that does not stand on its own — v0.1.0 shipped requiring a quark
  # without quarkdriver, and only the workspace made it build. This lane is
  # the consumer's view: no workspace, tidy must be a no-op, and the module
  # must build against the quark it pins.
  drivers-standalone:
    name: Driver modules (standalone, no workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy, build and vet each driver module against its pinned quark
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for m in drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle; do
            echo "== $m"
            (
              cd "$m"
              go mod tidy
              if ! git diff --exit-code -- go.mod go.sum; then
                echo "::error::$m/go.mod or go.sum is not tidy on its own (run: cd $m && GOWORK=off go mod tidy)" >&2
                exit 1
              fi
              go build ./...
              go vet ./...
            )
          done

  govulncheck:
    name: govulncheck
    # H-Q5. SECURITY.md points at the Go vulnerability database as the
    # source of truth for advisory status; this job is what backs that
    # claim. govulncheck only fails on vulnerabilities reachable from
    # Quark's code, so a red run is actionable, not noise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The CLI links every engine, so it is the artefact with the widest
      # dependency surface in this repository — and the one people install.
      # Scanning only the library would leave it unscanned.
      - name: Link the CLI module to this tree
        run: >
          bash scripts/ci/link_workspace.sh .
          cmd/quark
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      - name: Run govulncheck
        # Pinned to v1.3.0: govulncheck @latest (x/vuln v1.4.0) pulls
        # golang.org/x/tools v0.46.0, whose typesinternal.ForEachElement panics
        # on generic types ("ForEachElement called on type containing
        # *types.TypeParam") under Go 1.26 — which aborts the scan for a
        # generics-heavy module (panic, not a vuln finding). v1.3.0 is the last
        # release that analyses cleanly. Unpin once a newer x/tools fixes the
        # panic. The vulnerability database is fetched at run time, so a pinned
        # binary still scans against current advisories. Same pin as Nucleus.
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
          (cd cmd/quark && go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...)

  # ADR-0024 moved the CLI into its own module, so the root `go test ./...`
  # no longer reaches it — and the CLI is the binary this repository publishes
  # and signs. This lane is its build, vet and test, run the way the release
  # runs it: inside the module, linked to this tree through a workspace.
  cli:
    name: CLI module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The CLI requires the library and the five driver modules by version.
      # A `replace` would be the obvious way to point them at this tree, and
      # it is exactly what a published module must not carry: `go install`
      # refuses one. So the workspace does it, here and in the release.
      - name: Link the CLI module to this tree
        run: >
          bash scripts/ci/link_workspace.sh .
          cmd/quark
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      - name: Build, vet and test the CLI
        working-directory: cmd/quark
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1 -timeout 10m

      # The point of the split, asserted rather than assumed. The CLI is meant
      # to link every engine — that is why it exists as a separate module —
      # and a driver that silently stopped being linked would leave the tool
      # unable to talk to that database, with nothing failing until someone
      # pointed it at one.
      - name: The CLI links every engine
        working-directory: cmd/quark
        run: |
          set -euo pipefail
          deps=$(go list -deps .)
          for drv in go-sql-driver/mysql jackc/pgx modernc.org/sqlite go-mssqldb sijms/go-ora; do
            if ! echo "$deps" | grep -q "$drv"; then
              echo "::error::the CLI no longer links $drv; it is the one binary that must speak to every engine" >&2
              exit 1
            fi
          done
          echo "OK: all five engines are linked into the CLI"

  # The per-engine suites are their own module (ADR-0024). Without this lane
  # they would not be built at all: the root `go test ./...` stops at the
  # library's own module, and the integration matrix below only runs the
  # engines it boots. This is the SQLite half — no containers, so it is as
  # cheap as the library's own lane and covers the same test bodies the
  # matrix later runs against the other five engines.
  suites:
    name: Engine suites (SQLite)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the suites against SQLite
        working-directory: internal/enginesuite
        env:
          QUARK_TEST_REDIS_ADDR: localhost:6379
        run: go test ./... -timeout 15m -count=1

  test:
    name: Test (SQLite)
    runs-on: ubuntu-latest
    # QK6-1: real Redis for the CacheLocker contract tests (ADR-0020,
    # cache/redis TestAcquireLock_*) and for the Redis cache subtests that
    # probe localhost:6379 (SharedSuite Caching/Redis, TestCacheAllEngines
    # FASE 4). This job runs `go test ./...` unfiltered, so exporting
    # QUARK_TEST_REDIS_ADDR is the whole gate — no -run pattern to update.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        env:
          QUARK_TEST_REDIS_ADDR: localhost:6379
        run: go test ./... -timeout 5m -v -count=1

      - name: Fuzz (short, seeded)
        # A3-15. Scorecard's Fuzzing check is a 10-point item the suite scored
        # zero on, but the reason to keep this is the surfaces themselves: the
        # SQL guard, the struct-tag parser and the dialect escaping all take
        # untrusted input, and a hole in the first one is an injection. Each
        # target asserts an invariant (round-trip, re-parse, "an accepted
        # identifier cannot escape its quotes"), not just the absence of a
        # panic. The step above already runs every target's seed corpus as an
        # ordinary test; this adds a bounded amount of real mutation on top.
        # -fuzztime is a wall-clock budget per target, so the lane cannot run
        # long whatever the runner does — see the script for why the root
        # package's target is seed-corpus only here.
        run: bash scripts/ci/fuzz-short.sh

  # QK7-2: the race detector had no lane — data races only surfaced when
  # someone remembered to run -race by hand, and the gate was not even
  # reproducible (two 11000-row batch tests blew the default per-query
  # timeout under -race on modest hardware; they now carry their own
  # budget). -short and no engine containers keep the lane fast; the
  # SQLite/fake-driver tests are where the executor/pool concurrency
  # (implicit-tx AfterFunc, deferred commits, replica failover) actually
  # runs, so this is where -race pays for itself.
  race:
    name: Race (-short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with the race detector
        run: |
          set -euo pipefail
          go test -race -short -count=1 -timeout 15m ./...
          # Most of what the race detector is here for — the executor and pool
          # concurrency exercised through a real SQLite database — lives in
          # the engine-suite module since ADR-0024, so the lane has to reach
          # it or it stops covering what it was added for.
          (cd internal/enginesuite && go test -race -short -count=1 -timeout 20m ./...)

  # F6-8: the benchmark harness is its own module (separate go.mod with a
  # local `replace` directive), so the root `go test ./...` above does not
  # build it. This job compiles and smoke-runs it to keep it from rotting.
  # `-benchtime=1x` runs each benchmark exactly once — the goal is compile
  # + execute coverage, not stable numbers (those are produced on demand,
  # see benchmarks/README.md).
  benchmarks:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The benchmark module declares its own minimum Go version; pin
          # the toolchain to it so the module stays self-contained even if
          # its go.mod diverges from the root.
          go-version-file: benchmarks/go.mod
          cache: true

      - name: Build and smoke-run benchmarks
        working-directory: benchmarks
        run: |
          go vet ./...
          go test -run=^$ -bench=. -benchtime=1x -count=1 ./...

  # F0-8: per-engine integration matrix.
  # Spins up each engine and runs the SharedSuite against it. Docker is
  # pre-installed on ubuntu-latest runners. Each engine runs in parallel;
  # the matrix excludes SQLite (covered by the `test` job above).
  #
  # PG / MySQL / MariaDB / MSSQL boot via testcontainers-go inside the
  # test process. Oracle does NOT: testcontainers' lifecycle (reaper +
  # wait strategy) makes the gvenzl image exit code 1 within seconds on
  # hosted runners. Instead the `oracle` entry boots a plain `docker run`
  # container in a setup step and hands the suite a DSN via
  # QUARK_TEST_ORACLE_DSN — the proven path (v1.0 gate §A Item 1). When
  # that env var is set, `resolveOracleDSN` (containers_test.go) uses it
  # directly and skips testcontainers entirely.
  #
  # **Blocking** as of F0-8 followup final: a red light on any engine
  # fails the PR. The matrix landed first as advisory while the 11 latent
  # test-side bugs the first run surfaced were fixed in followups A-G;
  # with those closed, the matrix is now the canonical signal.
  integration:
    name: Integration (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # Job-level cap covers the slowest engine (Oracle: ~3-6 min cold boot
    # + suite) plus the second run step (all-engines legs, QK6-1). Per-step
    # execution is bounded by each step's own timeout below; this only
    # sizes the wall-clock envelope.
    timeout-minutes: 45
    # QK6-1: real Redis in every lane. TestMariaDBCache/Redis and the
    # SharedSuite Caching/Redis subtest probe localhost:6379 and skipped
    # in every previous run of the matrix; with the service they execute.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each lane's `-run` filter must also name the standalone
          # integration tests that live OUTSIDE the SharedSuite
          # entrypoints (QK5-4): deadlock retry per engine, and — on
          # postgres — LISTEN/NOTIFY, native RLS isolation and the
          # quarktenant RLS install pipeline. They skip silently when no
          # DSN is resolvable, so leaving them out of the filter meant
          # no lane ever executed them. Keep the filter itself: it is
          # what bounds lane time.
          #
          # QK6-1: the filter is applied as `^(…)$` (see the run step) —
          # the previous `^…$` form anchored only the first and last
          # alternatives. `leg` names this lane's subtest in the
          # all-engines tests (TestCacheAllEngines / TestOtelAllEngines /
          # TestBenchmarkEngines), executed by the second run step so the
          # per-engine legs stop being dead code without fragmenting the
          # matrix into more jobs.
          - engine: postgres
            run: 'TestSuitePostgres|TestPostgresReplicaRouting|TestDeadlockRetryPostgres|TestPgListener_RoundTrip|TestRowLevelSecurityNativePostgresIsolation|TestInstallRLSPolicies_Postgres|TestInstallRLSPolicies_Postgres_NoTenantColumn|TestTenantProvisionSchemaPerTenantPostgres'
            leg: Postgres
          - engine: mysql
            run: 'TestSuiteMySQL|TestDeadlockRetryMySQL'
            leg: MySQL
          - engine: mariadb
            # QK6-1: TestMariaDBOtel and TestMariaDBStress were outside
            # the filter (and read the raw env var) — never executed.
            run: 'TestSuiteMariaDB|TestMariaDBCache|TestMariaDBOtel|TestMariaDBStress|TestDeadlockRetryMariaDB'
            leg: MariaDB
          - engine: mssql
            run: TestSuiteMSSQL
            leg: MSSQL
          - engine: oracle
            run: TestSuiteOracle
            leg: Oracle
            # Oracle does a full DB init from scratch (~3 min cold) on
            # plain `:23-slim`; budget extra wall-clock for boot + suite.
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Oracle-only: testcontainers crashes on hosted runners, so boot a
      # plain container, wait for readiness, grant DBMS_LOCK (the DSN path
      # bypasses the test helper's grant), and export the DSN. ADR-0018:
      # the migration lock needs EXECUTE ON DBMS_LOCK, not granted to
      # schema users by default.
      - name: Start Oracle
        if: matrix.engine == 'oracle'
        # Bootstrap compartido con local (make oracle-up): readiness + GRANT
        # DBMS_LOCK (ADR-0018). Antes vivía duplicado aquí y en el job del
        # superapp.
        run: bash scripts/ci/oracle-up.sh QUARK_TEST_ORACLE_DSN

      - name: Run ${{ matrix.engine }} suite
        timeout-minutes: ${{ matrix.timeout || 20 }}
        # Inside the suites module (ADR-0024). The test NAMES are unchanged,
        # so the filters above still say what they said; what moved is the
        # directory they are run from. The module replaces every Quark
        # requirement with this tree, so it needs no workspace.
        working-directory: internal/enginesuite
        run: go test -tags=integration -timeout 25m -count=1 -run '^(${{ matrix.run }})$' -v ./...

      # The CLI provisions tenants against a real PostgreSQL, and it is a
      # module of its own now, so the run above cannot reach it. Postgres-only
      # because that is the only engine these two exercise.
      - name: Run the CLI's PostgreSQL tests
        if: matrix.engine == 'postgres'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The workspace belongs to THIS step: the CLI is its own module now
          # and needs it to resolve the five drivers from the tree. It is
          # removed on exit because the linker writes go.work in the repo
          # ROOT, where it outlives the step — the next one runs inside
          # internal/enginesuite and was resolving against a workspace that
          # does not list that module, dying with "main module … does not
          # contain package". Only postgres showed it: it is the only engine
          # that runs this step.
          trap 'rm -f "$GITHUB_WORKSPACE/go.work" "$GITHUB_WORKSPACE/go.work.sum"' EXIT
          bash scripts/ci/link_workspace.sh . cmd/quark drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle
          cd cmd/quark
          go test -tags=integration -timeout 14m -count=1 \
            -run '^TestTenantProvisionSchemaPerTenantPostgres$' -v ./...

      # QK6-1: this lane's leg of the all-engines tests. The `/` in the
      # pattern splits it into (top-level regex)/(subtest regex), so only
      # the ${{ matrix.leg }} subtest body runs — under -tags=integration
      # its resolver boots this engine's container (or reuses the DSN the
      # oracle setup step exported). The three tests moved with the suites to
      # the enginesuite module (ADR-0024), which is why this step and the one
      # above it both run from that directory and not from the repo root.
      - name: Run ${{ matrix.engine }} all-engines legs
        timeout-minutes: 15
        working-directory: internal/enginesuite
        env:
          # This module resolves through its own `replace` directives, not
          # through a workspace, so turning the workspace off makes the step
          # immune to any go.work another step leaves in the repo root — which
          # is exactly what broke this lane.
          GOWORK: "off"
        run: go test -tags=integration -timeout 14m -count=1 -run '^(TestCacheAllEngines|TestOtelAllEngines|TestBenchmarkEngines)$/^${{ matrix.leg }}$' -v .

  # S7-coverage: the superapp acceptance harness exercises Quark's public API
  # surface across all 6 engines in one process and gates on a manifest
  # (apisurface.json) minus an allowlist of non-invocable symbols
  # (allowlist.json). `-gate=strict` fails the PR if any in-scope public
  # symbol is left unexercised on a run engine, or if any exerciser asserts
  # red / leaks a goroutine or pool connection.
  #
  # Unlike the integration matrix, this is a SINGLE job with `-engines=all`:
  # the gate is union-based over one manifest, so fragmenting it per engine
  # would break its semantics. The harness boots PG/MySQL/MariaDB/MSSQL
  # itself via `docker run` (acceptance/engine); only Oracle needs the
  # same out-of-band setup as the integration job (testcontainers crashes the
  # gvenzl image on hosted runners), handed in via SUPERAPP_DSN_ORACLE — which
  # short-circuits the harness's own Docker management for Oracle.
  superapp:
    name: Superapp acceptance (6 engines)
    runs-on: ubuntu-latest
    # Boots Oracle (setup step) PLUS PG/MySQL/MariaDB/MSSQL (inside the run, via
    # the harness's own docker run) — more containers than the integration job's
    # single engine, so allow extra wall-clock headroom over its 35m.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Oracle
        # Mismo bootstrap compartido; la var del DSN es la que consume el
        # superapp.
        run: bash scripts/ci/oracle-up.sh SUPERAPP_DSN_ORACLE

      - name: Build and vet the harness
        # The examples lane used to compile every nested module, this one
        # included. With the examples gone, the cheap check lives here, in
        # front of the expensive run.
        working-directory: acceptance
        env:
          GOWORK: "off"
        run: go vet ./... && go build -o /dev/null .

      - name: Run superapp acceptance (all engines, strict gate)
        timeout-minutes: 25
        # From inside its own module (ADR-0024): the manifest and allowlist
        # paths default to this directory, and its go.mod already replaces
        # every Quark requirement with this tree.
        working-directory: acceptance
        run: go run . -engines=all -gate=strict

  # A3. This is the single check name branch protection should require on
  # `main`: requiring the individual lanes means editing the protection rule
  # every time one is added, renamed or split (the `integration` matrix alone
  # publishes one check name per engine). Adding a lane therefore means adding
  # its job id to the `needs:` list below — a lane that is not listed here does
  # not gate a merge.
  ci-required-gate:
    name: CI Required Gate
    runs-on: ubuntu-latest
    # `always()` so the gate still runs, and still reports, when one of its
    # needs failed or was cancelled. Without it the gate would itself be
    # skipped, and a skipped required check does not block a pull request —
    # the gate would go green by not running, which is the one thing it must
    # never do.
    if: always()
    needs:
      - lint
      - static-build
      - drivers
      - drivers-standalone
      - govulncheck
      - cli
      - suites
      - test
      - race
      - benchmarks
      - integration
      - superapp

    steps:
      - name: Evaluate required CI results
        env:
          # The whole `needs` context as JSON, so the evaluation below reads
          # exactly the list declared above and cannot drift from it when a
          # lane is added or removed.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key) result: \(.value.result)"'

          # `skipped` passes: a lane whose own `if:` was false did not run and
          # has nothing to report, so holding the merge on it would be a lie.
          # Everything else fails — `failure` obviously, and `cancelled` too,
          # because a lane that was stopped proves nothing and must not be
          # read as green.
          not_ok="$(
            echo "$NEEDS_JSON" | jq -r '
              [ to_entries[]
                | select(.value.result != "success" and .value.result != "skipped")
                | "\(.key) (\(.value.result))"
              ] | join(", ")
            '
          )"

          if [ -n "$not_ok" ]; then
            echo "Required jobs that did not succeed: $not_ok"
            exit 1
          fi

          echo "All required CI jobs passed."
