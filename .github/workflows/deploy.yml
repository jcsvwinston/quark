name: Deploy Pages redirector (docs live in the unified Quantum site)

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Least privilege: the workflow reads, and only the job that talks to the Pages
# API gets to write. `build` checks the tree out and uploads an artifact, which
# needs nothing beyond read.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# The JS actions used below (checkout, setup-node, upload-pages-artifact,
# deploy-pages) still declare Node 20 in their action.yml. GitHub forces Node 20
# JS actions to Node 24 on 2026-06-02; this env var opts in early so the
# workflow keeps running through the transition. Workflow-level so it covers
# every step in both jobs. Remove once the actions ship Node 24 releases.
# Mirrors .github/workflows/release-please.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5