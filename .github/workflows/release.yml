name: Release

# `push: tags` only fires for tags pushed with user credentials. Tags cut by
# release-please are created with the GITHUB_TOKEN, whose events GitHub
# suppresses (workflow-recursion guard), so the Release Please workflow
# chains this one via workflow_dispatch at the tag ref — github.ref_name is
# the tag either way, and every step below keys off it.
#
# The pattern matches the LIBRARY tag only. Quark cuts up to seven tags per
# train: `vX.Y.Z` for the module at the root, `drivers/<engine>/vX.Y.Z` for
# each of the five driver modules, and `cmd/quark/vX.Y.Z` for the CLI. All six
# of the others contain slashes, which `v*.*.*` does not match. The CLI tag is
# the one worth naming: it IS the module that produces the binary, but its
# archives are assets of the library release, so they are built and published
# by the run at the library tag — this one — and never by a run at its own.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Read-only by default: `verify` only checks out, builds and tests. `publish`
# declares the three writes it needs in its own block.
permissions:
  contents: read

env:
  # The same opt-in the Release Please workflow carries: JavaScript actions
  # that still declare Node 20 in their action.yml run on Node 24 instead of
  # warning on every step.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest

    steps:
      # First, and before a checkout: the tag is what names every archive, the
      # release the assets land on, and the identity the signature is checked
      # against. A run at anything else — a driver tag, a branch someone
      # dispatched by hand from the UI — would publish assets under a name no
      # verification command expects. `publish` needs this to hold and runs
      # only if this job passes, so the whole workflow stops here in seconds
      # rather than after a build.
      - name: The ref is a library tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::this workflow releases the library tag (vX.Y.Z); it was dispatched at '${GITHUB_REF_NAME}'"
              echo "The five driver modules are consumed from the Go proxy and publish no binaries."
              echo "The cmd/quark tag publishes none either: its archives ride on the library release, built by the run at the library tag."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The CLI is its own module (ADR-0024) and requires the library by
      # version. The workspace points that requirement at the tree being
      # tagged, which is what the release build does too — without it, this
      # job would check the CLI against the PREVIOUS release of the library.
      - name: Link the CLI module to this tree
        run: >
          bash scripts/ci/link_workspace.sh .
          cmd/quark
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      # The engine matrix belongs to CI on `main`, which has already run for
      # the commit this tag points at. What is worth asking again here, of the
      # exact tree about to be signed, is narrower: does it build the way
      # GoReleaser will build it — no cgo, every package — and does the CLI
      # that ships in the archives still behave.
      - name: Build the way the release builds
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build ./...
          (cd cmd/quark && CGO_ENABLED=0 go build ./...)

      - name: go vet
        run: |
          set -euo pipefail
          go vet ./...
          (cd cmd/quark && go vet ./...)

      - name: CLI tests
        working-directory: cmd/quark
        run: go test -short -count=1 ./...

  publish:
    name: Publish Artifacts
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # All three are load-bearing and none replaces another: `contents` is
      # what GoReleaser uploads the assets with (and what the "Check Existing
      # Release" step below reads the releases API with), `id-token` is the
      # OIDC token cosign signs with (keyless: no key lives in this
      # repository), and `attestations` is what writes the build provenance.
      # Dropping any one of them fails a different step.
      contents: write
      id-token: write
      attestations: write

    env:
      # GoReleaser infers the version from the tags at HEAD, and in this
      # repository that inference is one lexical accident away from wrong.
      # Release Please cuts the library tag and the five
      # `drivers/<engine>/vX.Y.Z` tags on the SAME commit — the sibling floors
      # are raised as the first commit of every train — so six tags point at
      # the release commit, and GoReleaser takes the first line of
      # `git tag --points-at HEAD --sort=-version:refname`. That happens to be
      # the library tag only because `v` sorts after `d`. Anywhere HEAD is not
      # exactly on a tag GoReleaser falls back to `git describe --tags`, and
      # that was measured on this tree: it picks `drivers/mssql/v0.1.3` and
      # writes archives named
      # `quark_drivers/mssql/v0.1.3-next_linux_amd64.tar.gz` — slashes and
      # all, which become subdirectories under dist/. `github.ref_name` is the
      # tag this run was dispatched at, and it is the only tag whose name
      # should ever appear on an asset.
      GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # goreleaser-action installs neither of these, and the config calls both
      # by bare name. Installing them before GoReleaser runs means a missing
      # tool fails here, in one line, instead of halfway through a release.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # The CLI module requires the library by version, not through a replace
      # directive: a published module carrying one is a module `go install`
      # refuses. The workspace is what makes the release build the CLI against
      # the tree being tagged rather than against the previous release —
      # GoReleaser runs the Go command inside cmd/quark (`dir:` in the config)
      # and picks this up.
      - name: Link the CLI module to this tree
        run: >
          bash scripts/ci/link_workspace.sh .
          cmd/quark
          drivers/postgres drivers/mysql drivers/sqlite drivers/mssql drivers/oracle

      # The version stamped into the binary comes from the CLI's OWN tag
      # series (`cmd/quark/vX.Y.Z`), because that is the series
      # `go install .../cmd/quark@latest` resolves and records — the two have
      # to agree or the same program reports different versions depending on
      # how it was obtained. A train that changes nothing under cmd/quark cuts
      # no CLI tag, so the nearest one reachable from HEAD is the answer
      # there; only a release cut before the CLI module had any tag at all
      # falls back to the library tag.
      - name: Resolve the CLI version to stamp
        run: |
          set -euo pipefail
          cli_tag=$(git tag --points-at HEAD --sort=-version:refname | grep '^cmd/quark/v' | head -1 || true)
          if [ -z "$cli_tag" ]; then
            cli_tag=$(git describe --tags --match 'cmd/quark/v*' --abbrev=0 2>/dev/null || true)
          fi
          if [ -n "$cli_tag" ]; then
            version="${cli_tag#cmd/quark/}"
          else
            echo "::warning::no cmd/quark tag is reachable from ${GITHUB_REF_NAME}; stamping the library tag instead"
            version="$GITHUB_REF_NAME"
          fi
          echo "stamping CLI version $version"
          echo "QUARK_CLI_VERSION=$version" >> "$GITHUB_ENV"

      # Release Please creates the GitHub Release before it dispatches this
      # workflow, so "the release exists" says nothing about whether its
      # assets do. The question that matters is whether the release is
      # COMPLETE — archives, one SBOM per archive, the checksum file, its
      # signature and its certificate — because a run that uploaded the six
      # archives and then failed to sign leaves a release that "has assets"
      # and would be skipped by every re-run, staying unsigned for good.
      - name: Check Existing Release
        id: release_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          if [ "$STATUS" = "200" ]; then
            jq -r '.assets[].name' /tmp/release.json > /tmp/assets.txt
          else
            : > /tmp/assets.txt
          fi

          count() { grep -cE "$1" /tmp/assets.txt || true; }
          archives=$(count '\.(tar\.gz|zip)$')
          sboms=$(count '\.spdx\.json$')
          checksums=$(count '^checksums\.txt$')
          signature=$(count '^checksums\.txt\.sig$')
          certificate=$(count '^checksums\.txt\.pem$')

          echo "archives=$archives sboms=$sboms checksums=$checksums signature=$signature certificate=$certificate"

          if [ "$archives" -eq 0 ] || [ "$sboms" -ne "$archives" ] ||
             [ "$checksums" -ne 1 ] || [ "$signature" -ne 1 ] || [ "$certificate" -ne 1 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The assets are all there. The provenance attestation is NOT an
          # asset — it lives in the attestations API — so the asset list
          # cannot see it, and a run that signed and then failed to attest
          # would look finished forever. Ask for it by the digest of the
          # first archive the published checksum file lists: the attestation
          # covers every entry in that file.
          asset_url=$(jq -r '.assets[] | select(.name == "checksums.txt") | .url' /tmp/release.json)
          curl -sSL -o /tmp/published_checksums.txt \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$asset_url"
          digest=$(awk '$2 ~ /\.tar\.gz$/ { print $1; exit }' /tmp/published_checksums.txt)
          attested=0
          if [ -n "$digest" ]; then
            ATT_STATUS=$(curl -sS -o /tmp/attestations.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/attestations/sha256:${digest}")
            if [ "$ATT_STATUS" = "200" ]; then
              attested=$(jq -r '(.attestations // []) | length' /tmp/attestations.json)
            fi
          fi
          echo "attestations=$attested for sha256:${digest:-<none>}"

          if [ "$attested" -gt 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish With GoReleaser
        if: steps.release_check.outputs.complete != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One attestation over the checksum file covers every artifact listed in
      # it — the six archives and the six SBOMs — instead of one round trip
      # per artifact. `gh attestation verify <archive>` resolves it by digest,
      # so a consumer never has to know that.
      - name: Attest Build Provenance
        if: steps.release_check.outputs.complete != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Skip Publish (Already Released)
        if: steps.release_check.outputs.complete == 'true'
        run: |
          echo "Release ${GITHUB_REF_NAME} already carries signed, attested artifacts."
